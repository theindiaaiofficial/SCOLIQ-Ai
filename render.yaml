services:
  - type: web
    name: smartattend-ai-backend
    runtime: docker
    plan: starter
    healthCheckPath: /health/ready
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_SETUP_TOKEN
        generateValue: true
      - key: FACE_TEMPLATE_ENCRYPTION_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_NAME
        value: SCOLIQ AI
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FACE_PROVIDER
        value: manual
      - key: SCHOOL_TIMEZONE
        value: Asia/Kolkata
